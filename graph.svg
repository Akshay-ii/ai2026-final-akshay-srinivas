    <circle cx="110" cy="332" r="8" fill="#fff" stroke="#ccc"/><text x="110" y="335" text-anchor="middle">1</text>
    <circle cx="182" cy="177" r="8" fill="#fff" stroke="#ccc"/><text x="182" y="180" text-anchor="middle">2</text>
    <circle cx="184" cy="320" r="8" fill="#fff" stroke="#ccc"/><text x="184" y="323" text-anchor="middle">2</text>
    <circle cx="220" cy="259" r="8" fill="#fff" stroke="#ccc"/><text x="220" y="262" text-anchor="middle">1</text>
    <circle cx="255" cy="72"  r="8" fill="#fff" stroke="#ccc"/><text x="255" y="75" text-anchor="middle">1</text>
    <circle cx="255" cy="162" r="8" fill="#fff" stroke="#ccc"/><text x="255" y="165" text-anchor="middle">1</text>
    <circle cx="255" cy="248" r="8" fill="#fff" stroke="#ccc"/><text x="255" y="251" text-anchor="middle">1</text>
    <circle cx="255" cy="337" r="8" fill="#fff" stroke="#ccc"/><text x="255" y="340" text-anchor="middle">2</text>
    <circle cx="255" cy="253" r="8" fill="#fff" stroke="#ccc"/><text x="255" y="256" text-anchor="middle">2</text>
    <circle cx="255" cy="428" r="8" fill="#fff" stroke="#ccc"/><text x="255" y="431" text-anchor="middle">1</text>
    <circle cx="333" cy="474" r="8" fill="#fff" stroke="#ccc"/><text x="333" y="477" text-anchor="middle">2</text>
    <circle cx="412" cy="65"  r="8" fill="#fff" stroke="#ccc"/><text x="412" y="68" text-anchor="middle">1</text>
    <circle cx="412" cy="151" r="8" fill="#fff" stroke="#ccc"/><text x="412" y="154" text-anchor="middle">1</text>
    <circle cx="412" cy="225" r="8" fill="#fff" stroke="#ccc"/><text x="412" y="228" text-anchor="middle">1</text>
    <circle cx="412" cy="330" r="8" fill="#fff" stroke="#ccc"/><text x="412" y="333" text-anchor="middle">1</text>
    <circle cx="379" cy="310" r="8" fill="#fff" stroke="#ccc"/><text x="379" y="313" text-anchor="middle">2</text>
    <circle cx="412" cy="326" r="8" fill="#fff" stroke="#ccc"/><text x="412" y="329" text-anchor="middle">2</text>
    <circle cx="412" cy="416" r="8" fill="#fff" stroke="#ccc"/><text x="412" y="419" text-anchor="middle">1</text>
    <circle cx="565" cy="139" r="8" fill="#fff" stroke="#ccc"/><text x="565" y="142" text-anchor="middle">1</text>
    <circle cx="565" cy="224" r="8" fill="#fff" stroke="#ccc"/><text x="565" y="227" text-anchor="middle">3</text>
    <circle cx="565" cy="314" r="8" fill="#fff" stroke="#ccc"/><text x="565" y="317" text-anchor="middle">1</text>
  </g>

  <!-- ===== NODES ===== -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="40" cy="224" r="26" fill="#10B981" stroke="#0b0d10" stroke-width="2"/><text x="40" y="228">GIVA</text>
    <circle cx="180" cy="79" r="26" fill="#F59E0B" stroke="#0b0d10" stroke-width="1"/><text x="180" y="83">TALON</text>
    <circle cx="180" cy="258" r="26" fill="#3B82F6" stroke="#0b0d10" stroke-width="1"/><text x="180" y="262">TARO</text>
    <circle cx="180" cy="440" r="26" fill="#334155" stroke="#0b0d10" stroke-width="1"/><text x="180" y="444">RAVEN</text>
    <circle cx="329" cy="66" r="26" fill="#F97316" stroke="#0b0d10" stroke-width="1"/><text x="329" y="70">VYNE</text>
    <circle cx="329" cy="244" r="26" fill="#F43F5E" stroke="#0b0d10" stroke-width="1"/><text x="329" y="248">WALTZ</text>
    <circle cx="329" cy="415" r="26" fill="#6366F1" stroke="#0b0d10" stroke-width="1"/><text x="329" y="419">ORBIT</text>
    <circle cx="495" cy="65" r="26" fill="#A855F7" stroke="#0b0d10" stroke-width="1"/><text x="495" y="69">ROOK</text>
    <circle cx="495" cy="236" r="26" fill="#4F46E5" stroke="#0b0d10" stroke-width="1"/><text x="495" y="240">QUILL</text>
    <circle cx="495" cy="416" r="26" fill="#0EA5E9" stroke="#0b0d10" stroke-width="1"/><text x="495" y="420">JARO</text>
    <circle cx="635" cy="212" r="26" fill="#DC2626" stroke="#0b0d10" stroke-width="2"/><text x="635" y="216">ECHO</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g font-size="12" fill="#333">
    <circle cx="55" cy="565" r="7" fill="#10B981"/><text x="70" y="569">GIVA = start node</text>
    <circle cx="55" cy="588" r="7" fill="#DC2626"/><text x="70" y="592">ECHO = goal node</text>
    <line x1="230" y1="565" x2="270" y2="565" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="280" y="569">one-way transition</text>
    <line x1="230" y1="588" x2="270" y2="588" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="280" y="592">two-way transition</text>
    <text x="55" y="615" font-size="11" fill="#777">Numbers on edges = transition weight</text>
  </g>
