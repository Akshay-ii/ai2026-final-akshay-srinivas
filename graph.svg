<svg viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="640" fill="#ffffff"/>

  <!-- ===== EDGES (drawn first, under nodes) ===== -->
  <!-- directed (single arrow) -->
  <line x1="40" y1="224" x2="180" y2="79"  stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="40" y1="224" x2="180" y2="258" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="40" y1="224" x2="180" y2="440" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="180" y1="79"  x2="329" y2="66"  stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="180" y1="258" x2="329" y2="244" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="180" y1="258" x2="329" y2="415" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="329" y1="66"  x2="495" y2="65"  stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="495" y1="65"  x2="635" y2="212" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="495" y1="416" x2="635" y2="212" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- bidirectional (arrow both ends) -->
  <path d="M40,224 Q180,120 329,244" fill="none" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="40" y1="224" x2="329" y2="415" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M180,79 Q260,258 180,440" fill="none" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="180" y1="79"  x2="329" y2="244" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="180" y1="440" x2="329" y2="66"  stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="180" y1="440" x2="329" y2="415" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M180,440 Q329,520 495,416" fill="none" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="329" y1="66"  x2="495" y2="236" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="329" y1="244" x2="495" y2="236" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="329" y1="244" x2="495" y2="416" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="329" y1="415" x2="495" y2="65"  stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="329" y1="415" x2="495" y2="236" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="329" y1="415" x2="495" y2="416" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="495" y1="236" x2="635" y2="212" stroke="#2a6" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>

